[project]
name = "satchel-signer"
version = "0.1.0"
description = "Offline device that signs transactions using only the child keys it is given per payment"
requires-python = ">=3.12"
dependencies = ["satchel-core"]

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"
