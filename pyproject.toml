[project]
name = "satchel"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["satchel-core", "satchel-vault", "satchel-signer", "satchel-agent", "satchel-marketplace", "satchel-laptop"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.uv]
package = false
constraint-dependencies = [
    "fastapi<0.143",
    "iniconfig<2.3.1",
    "pydantic<2.14",
    "pydantic-core<2.50",
    "pycparser<3.1",
    "opentelemetry-api<1.45.1",
]

[tool.uv.workspace]
members = ["core", "vault", "signer", "agent", "marketplace", "laptop"]

[tool.uv.sources]
satchel-core = { workspace = true }
satchel-vault = { workspace = true }
satchel-signer = { workspace = true }
satchel-agent = { workspace = true }
satchel-marketplace = { workspace = true }
satchel-laptop = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["core/tests", "tests", "vault/tests", "laptop/tests", "agent/tests"]
addopts = "--import-mode=importlib"
markers = ["regtest: needs the local regtest bitcoind (uv run scripts/regtest.py up)"]
