[project]
name = "satchel-vault"
version = "0.1.0"
description = "Offline device that holds the master seed and never signs anything"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi>=0.142.2",
    "satchel-core",
    "uvicorn>=0.54.0",
]

[project.scripts]
satchel-vault = "satchel_vault.cli:main"

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"
