[project]
name = "satchel-xray"
version = "0.1.0"
description = "X-ray backend: event tailing, enrichment, SSE and state aggregation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "satchel-core",
    "uvicorn>=0.54.0",
]

[project.scripts]
satchel-xray = "satchel_xray.cli:main"

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"
